name: CI/CD — Deploy to Railway

on:
  push:
    branches:
      - main   # Se ejecuta en cada push a main

jobs:
  test:
    name: Verificar que la app arranca
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Comprobar que el servidor arranca
        run: |
          node app.js &
          sleep 3
          curl -f http://localhost:8080/health || exit 1
          kill %1

  deploy:
    name: Desplegar en Railway
    runs-on: ubuntu-latest
    needs: test   # Solo despliega si el test pasa

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Desplegar en Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
